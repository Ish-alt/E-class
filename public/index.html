<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="One welcoming space for teachers to teach and students to learn."
    />
    <title>Classroom — Learn together</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div id="auth-screen" class="auth-screen"></div>
    <div class="app-shell" id="app-shell" hidden>
      <aside class="sidebar" aria-label="Main navigation">
        <a class="brand" href="#" aria-label="Classroom home">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path d="M5 8.5 16 3l11 5.5v15L16 29 5 23.5v-15Z" fill="currentColor" />
              <path d="M11 12.5c2.8-1.6 6.2-1.6 9 0v8c-2.8-1.6-6.2-1.6-9 0v-8Z" fill="#fff" />
              <path d="M15.5 12v9" stroke="#fff" stroke-width="1.5" />
            </svg>
          </span>
          <span>classroom<span class="brand-period">.</span></span>
        </a>

        <div class="sidebar-label">MENU</div>
        <nav class="primary-nav">
          <button class="nav-link active" type="button" data-action="set-view" data-view="home">
            <span class="nav-icon" aria-hidden="true">⌂</span>
            <span>Home</span>
          </button>
          <button class="nav-link" type="button" data-action="set-view" data-view="assignments">
            <span class="nav-icon" aria-hidden="true">▤</span>
            <span>Assignments</span>
            <span class="nav-count" id="nav-count">0</span>
          </button>
          <button class="nav-link" type="button" data-action="set-view" data-view="classes">
            <span class="nav-icon" aria-hidden="true">▦</span>
            <span>My classes</span>
          </button>
          <button class="nav-link" type="button" data-action="open-settings">
            <span class="nav-icon" aria-hidden="true">⚙</span>
            <span>Settings</span>
          </button>
        </nav>

        <div class="sidebar-label courses-label">YOUR CLASSES</div>
        <nav class="course-nav" id="course-nav" aria-label="Your classes"></nav>

        <div class="sidebar-bottom">
          <div class="help-card">
            <div class="help-spark" aria-hidden="true">✦</div>
            <strong>Learning is better together</strong>
            <p>Your classroom, all in one place.</p>
          </div>
          <div class="sidebar-user">
            <div class="avatar avatar-plum" id="sidebar-avatar">AM</div>
            <div class="sidebar-user-copy">
              <strong id="sidebar-name">Alex Morgan</strong>
              <span id="sidebar-role">Student account</span>
            </div>
            <span class="more-dots" aria-hidden="true">•••</span>
          </div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="breadcrumb"><span>Workspace</span><span class="crumb-slash">/</span><strong id="breadcrumb-current">Home</strong></div>
          <div class="topbar-actions">
            <button class="icon-button notification-button" type="button" aria-label="Notifications">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
              <span class="notification-dot"></span>
            </button>
            <div class="avatar avatar-plum top-avatar" id="top-avatar">AM</div>
            <button class="secondary-button settings-button" id="settings-button" type="button" data-action="open-settings" aria-label="Profile and settings">Settings</button>
            <button class="secondary-button logout-button" id="logout-button" type="button">Sign out</button>
          </div>
        </header>

        <div class="page-wrap">
          <div class="page-content" id="page-content" aria-live="polite"></div>
          <footer class="page-footer">
            <span>Made for curious minds <span class="footer-heart">♥</span></span>
            <span>Classroom <span id="current-year"></span></span>
          </footer>
        </div>
      </main>
    </div>
    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="modal-root"></div>
    <script src="/app.js"></script>
  </body>
</html>
